name: Verifica rame FT Mercati e Westmetall
on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * 1-5' # 17:30 UTC = 18:30 inverno / 19:30 estate Italia
permissions:
  contents: write
  issues: write
concurrency:
  group: copper-source-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verifica fonti
        id: retrieve
        continue-on-error: true
        run: python scripts/update_copper_sources.py
      - name: Salva report e storico separati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/copper_sources_status.json data/copper_westmetall_history.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna controllo fonti rame'
            git push
          fi
      - name: Errore se controllo fallito
        if: steps.retrieve.outcome == 'failure'
        run: exit 1
