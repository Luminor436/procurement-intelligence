name: Aggiorna cambio EUR USD BCE
on:
  workflow_dispatch:
  schedule:
    - cron: '20 17 * * 1-5'
permissions:
  contents: write
  issues: write
concurrency:
  group: ecb-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica e verifica dati BCE
        run: python scripts/update_ecb.py
      - name: Pubblica dati se modificati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/eurusd_ecb.csv data/fx_status.json
          git diff --cached --quiet || (git commit -m 'Aggiorna EUR/USD BCE' && git push)
      - name: Apri issue in caso di errore
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title 'ERRORE: aggiornamento BCE EUR/USD' --body "Workflow fallito. Controllare Actions e fonte BCE. Nessun dato fittizio inserito." || true
