name: Controlla aggiornamento offerte noli
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica storico offerte
        run: python scripts/check_freight.py
      - name: Salva stato
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/freight_status.json
          git diff --cached --quiet || (git commit -m 'Controlla freschezza noli' && git push)
      - name: Segnala offerte assenti o obsolete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          x=json.load(open('data/freight_status.json'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('FREIGHT_ALERT='+str(x['status']!='ok').lower()+'\n')
          PY
      - name: Crea issue senza duplicati
        if: env.FREIGHT_ALERT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh issue list --state open --search 'Noli port-to-port: offerte mancanti o obsolete in:title' --json title --jq '.[].title' | grep -Fxq 'Noli port-to-port: offerte mancanti o obsolete'; then
            gh issue create --title 'Noli port-to-port: offerte mancanti o obsolete' --body 'Controllo automatico: nessuna offerta verificata o ultima quotazione più vecchia di 30 giorni. Aggiornare data/freight_quotes.csv. Non vengono creati valori fittizi.'
          fi
